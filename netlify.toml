[build]
  publish = "."

[[redirects]]
  from = "/c/:slug"
  to = "/concurso.html?c=:slug"
  status = 200

[[redirects]]
  from = "/criadores"
  to = "/criadores.html"
  status = 200

[[redirects]]
  from = "/historico"
  to = "/historico.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
